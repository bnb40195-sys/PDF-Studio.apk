name: Build Android Debug APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag name (leave blank for automatic tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Prepare Output APK
        id: prepare_apk
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" output/DocuScan-PDFStudio-debug.apk
            cp "$APK_PATH" output/app-debug.apk
            echo "apk_path=output/DocuScan-PDFStudio-debug.apk" >> $GITHUB_OUTPUT
            ls -lh output/
          else
            echo "Error: APK file not found in android/app/build/outputs/apk/debug!"
            exit 1
          fi

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuScan-PDFStudio-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Determine Release Tag
        id: release_meta
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag will be: $TAG"

      - name: Publish APK to GitHub Releases (Direct Download)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "DocuScan & PDF Studio Android App ${{ steps.release_meta.outputs.tag_name }}"
          make_latest: true
          generate_release_notes: false
          body: |
            ## 📱 تطبيق DocuScan & PDF Studio للأندرويد
            **تطبيق الماسح الضوئي الشامل واستوديو ومحرر الـ PDF بدون إنترنت 100%**

            ---

            ### 🚀 المميزات المضمنة في هذا الإصدار:
            - 📷 **الماسح الضوئي الشامل**: مسح الأوراق وفلاتر تنقية الصور والورق (Magic Color، B&W عالي التباين، إزالة الظلال).
            - ⚡ **الماسح الذكي لكل شيء**:
              - حل وتفكيك المعادلات والمسائل الرياضية خطوة بخطوة 🧮.
              - تدقيق الفواتير المحاسبية واستخراج الإجماليات والضرائب 🧾.
              - فحص الروشتات والتقارير الطبية وتفصيل الأدوية 🩺.
              - فك تشفير رموز الـ QR والباركود فورياً بدون إنترنت 📱.
              - قراءة بطاقات الهوية واستخراج جهات الاتصال (vCard) 💼.
            - 📄 **عارض ومحرر PDF مدمج**: فتح وتصفح ملفات الـ PDF، استخراج صفحاتها للماسح، وإضافة العلامات المائية.
            - 🖼️ **تحويل الصور إلى PDF**: تحويل ألبومات الصور لملفات PDF مع التحكم التام في الهوامش والمقاسات.
            - ✨ **تصميم وتوليد PDF**: إعداد العقود، الفواتير، التقارير، والشهادات المعتمدة.
            - 📁 **اختيار مسارات الملفات من الهاتف**: استعراض واختيار مسارات ملفات PDF وصور الرموز من ذاكرة الهاتف الخارجية.
            - 🔒 **خصوصية محلية 100%**: معالجة الملفات والبيانات بالكامل داخل جهازك دون إرسالها لأي خادم خارجي.

            ---

            ### 📥 رابط التحميل المباشر للـ APK:
            حمل ملف `DocuScan-PDFStudio-debug.apk` المرفق أدناه وثبته مباشرة على هاتفك الأندرويد.
          files: |
            output/DocuScan-PDFStudio-debug.apk
            output/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
